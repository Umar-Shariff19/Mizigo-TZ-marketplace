name: Mizigo CI Pipeline

on:
  push:
    branches: [ main, backend-refactor ]
  pull_request:
    branches: [ main, backend-refactor ]

jobs:
  backend-test:
    name: Backend Tests & PostgreSQL Concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mizigo_test
          POSTGRES_PASSWORD: mizigo_test_secret
          POSTGRES_DB: mizigo_disposable_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against isolated PostgreSQL
        env:
          DATABASE_URL: "postgresql://mizigo_test:mizigo_test_secret@localhost:5433/mizigo_disposable_db"
          ENVIRONMENT: "development"
        run: |
          alembic upgrade head

      - name: Run Pytest suite (SQLite baseline & PostgreSQL concurrency)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long-12345"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          ENVIRONMENT: "testing"
          REQUIRE_PG_TESTS: "1"
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend for production
        run: npm run build
