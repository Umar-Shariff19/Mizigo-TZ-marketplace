services:
  api:
    build: .
    container_name: mizigo-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mizigo:mizigo@db:5432/mizigo
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: mizigo-db
    environment:
      POSTGRES_DB: mizigo
      POSTGRES_USER: mizigo
      POSTGRES_PASSWORD: mizigo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
