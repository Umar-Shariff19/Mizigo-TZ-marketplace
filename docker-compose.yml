services:
  api:
    build: .
    container_name: mizigo-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mizigo:mizigo@db:5432/mizigo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    container_name: mizigo-db
    environment:
      POSTGRES_DB: mizigo
      POSTGRES_USER: mizigo
      POSTGRES_PASSWORD: mizigo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizigo -d mizigo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
